<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220">
  <!-- Counter grain (page background), tiled at 220px, static. Two-tone specks that cannot cost contrast:
       dark specks are exactly paper-2 #E6DDCA (the worst case every text colour is checked against, DESIGN.md 2.1),
       light specks are stock #FBF8F0 at full alpha. sRGB filter space so the constants are the real colours.
       Measured in Chromium at 1x: luminance std-dev 8.8 over the paper colour (was 5.9), darkest pixel (231,222,203). -->
  <filter id="n" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" stitchTiles="stitch" result="a"/>
    <feColorMatrix in="a" values="0 0 0 0 .906  0 0 0 0 .871  0 0 0 0 .796  0 0 0 12 -5.6" result="dark"/>
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="41" stitchTiles="stitch" result="b"/>
    <feColorMatrix in="b" values="0 0 0 0 .984  0 0 0 0 .973  0 0 0 0 .941  0 0 0 12 -5.8" result="light"/>
    <feComponentTransfer in="light" result="light2"><feFuncA type="linear" slope="1"/></feComponentTransfer>
    <feMerge><feMergeNode in="light2"/><feMergeNode in="dark"/></feMerge>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
