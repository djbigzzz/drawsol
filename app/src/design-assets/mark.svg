<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28" width="36" height="28" role="img" aria-label="DrawSol">
  <!-- The DrawSol mark: a notched paper ticket printed with a barcode of uneven bar widths (1, 2, 1, 3,
       packed asymmetrically, so it reads as a barcode, never as a fence). One bar, off-centre at x=23 and
       3 units wide, is vermilion and breaks out 6px above the top edge: the drawn ticket. Solid ink on
       both sides of it (x 19-23 and 26-29) so the red reads as a bar, not a hairline; at 20px it is
       still 2.1 device px wide. A dashed perforation at x=29 tears off the stub. Notches r=4. Integer
       coordinates; use at 28px (masthead), 20px (footer, mobile) or 56px+. Bars are knocked out in
       stock, not transparent, so the mark keeps its contrast on paper and on grain. -->
  <path d="M1 7h34v6a4 4 0 0 0 0 8v6H1v-6a4 4 0 0 0 0-8z" fill="#1B1814"/>
  <g fill="#FBF8F0">
    <rect x="7" y="11" width="1" height="12"/>
    <rect x="9" y="11" width="2" height="12"/>
    <rect x="13" y="11" width="1" height="12"/>
    <rect x="16" y="11" width="3" height="12"/>
    <rect x="29" y="10" width="1" height="2"/>
    <rect x="29" y="14" width="1" height="2"/>
    <rect x="29" y="18" width="1" height="2"/>
    <rect x="29" y="22" width="1" height="2"/>
  </g>
  <rect x="23" y="1" width="3" height="22" fill="#DE3F2B"/>
</svg>
