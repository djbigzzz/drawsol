<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
  <!-- Card-stock fibre (tickets, stubs, slips, sheet, mobile bar), tiled at 180px, finer than the counter.
       Specks are exactly stock-2 #F3EEE2 at most, so the darkest pixel never passes the AA worst case.
       Measured in Chromium: std-dev about 2.7 / 3.5 / 5, darkest pixel (244,239,227). -->
  <filter id="n" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .957  0 0 0 0 .937  0 0 0 0 .89  0 0 0 8 -4.0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
