[package]
name = "drawsol"
version = "2.0.0"
description = "DrawSol v2 - escrowed prize draw with ORAO VRF instant wins"
edition = "2021"
# Load-bearing: lets the resolver pick crate versions that platform-tools v1.43 (cargo 1.79) can parse.
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "drawsol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "orao-solana-vrf/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
orao-solana-vrf = { version = "=0.6.1", default-features = false, features = ["cpi"] }
